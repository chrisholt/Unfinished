<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Hour Finder</title>
  <meta name="description" content="Happy hours, menus and prices at pubs and bars within 2 km.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="brand">
      <span class="logo" aria-hidden="true">🍺</span>
      <div>
        <h1>Happy Hour Finder</h1>
        <p class="tagline">Happy hour menus and prices within 2 km</p>
      </div>
    </header>

    <section class="controls" aria-label="Location">
      <button id="locate-btn" class="btn btn-primary btn-wide" type="button">📍 Use my location</button>
      <form id="search-form" class="search" role="search" autocomplete="off">
        <input id="search-input" type="search" placeholder="…or search a suburb or street" aria-label="Search location">
        <button type="submit" class="btn">Search</button>
        <ul id="search-results" class="search-results" hidden></ul>
      </form>
      <div class="when-row">
        <label class="when">
          <span>When</span>
          <input id="when-input" type="datetime-local">
        </label>
        <button id="now-btn" class="btn" type="button" title="Reset to the current time">Now</button>
      </div>
    </section>

    <p id="location-line" class="location-line">Choose a location to see happy hours nearby.</p>
    <div id="maps-links" class="maps-links"></div>

    <section class="filters" aria-label="Filter and sort">
      <div class="chips" role="group" aria-label="Filter">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="live">On now</button>
        <button class="chip" data-filter="today">Today</button>
      </div>
      <select id="sort-select" aria-label="Sort">
        <option value="distance">Nearest</option>
        <option value="soonest">Happy hour soonest</option>
        <option value="cheapest">Cheapest drink</option>
      </select>
      <input id="name-filter" class="name-filter" type="search" placeholder="Filter by name…" aria-label="Filter by name">
    </section>

    <div id="status" class="status" hidden></div>
    <ol id="venue-list" class="venue-list"></ol>

    <footer class="footer">
      Venue names and addresses &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors.
      Prices marked <em>Estimated</em> are typical for the venue type, not the venue's published offer.
    </footer>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
