<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Hour Finder</title>
  <meta name="description" content="Real happy hours, menus and prices within 2 km of James Bay, Victoria BC.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="brand">
      <span class="logo" aria-hidden="true">🍺</span>
      <div>
        <h1>Happy Hour Finder</h1>
        <p class="tagline">Happy hours within 2 km · Victoria, BC</p>
      </div>
    </header>

    <p id="location-line" class="location-line"></p>
    <div class="controls">
      <button id="locate-btn" class="btn" type="button">📍 Use my location</button>
      <button id="home-btn" class="btn" type="button" hidden>🏠 Back to Oswego St</button>
    </div>

    <div id="maps-links" class="maps-links"></div>

    <section class="filters" aria-label="Filter and sort">
      <div class="chips" role="group" aria-label="Filter">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="live">On now</button>
        <button class="chip" data-filter="today">Today</button>
      </div>
      <select id="sort-select" aria-label="Sort">
        <option value="distance">Nearest</option>
        <option value="soonest">Happy hour soonest</option>
      </select>
      <div class="when-row">
        <label class="when">
          <span>When</span>
          <input id="when-input" type="datetime-local">
        </label>
        <button id="now-btn" class="btn" type="button" title="Reset to the current time">Now</button>
      </div>
    </section>

    <div id="status" class="status" hidden></div>
    <ol id="venue-list" class="venue-list"></ol>

    <footer id="footer" class="footer"></footer>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
